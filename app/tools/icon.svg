  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#aurora)"/>
  <rect width="1024" height="1024" fill="url(#violet)"/>
  <g fill="#fff">
    <circle cx="140" cy="210" r="5" opacity=".8"/><circle cx="252" cy="120" r="3.5" opacity=".6"/><circle cx="318" cy="268" r="3" opacity=".5"/>
    <circle cx="760" cy="150" r="4.5" opacity=".75"/><circle cx="868" cy="310" r="3.5" opacity=".55"/><circle cx="690" cy="258" r="3" opacity=".45"/>
    <circle cx="92" cy="420" r="3" opacity=".45"/><circle cx="930" cy="470" r="4" opacity=".6"/><circle cx="220" cy="540" r="2.5" opacity=".4"/>
    <circle cx="820" cy="560" r="2.5" opacity=".4"/><circle cx="400" cy="90" r="2.5" opacity=".5"/><circle cx="600" cy="110" r="3" opacity=".55"/>
