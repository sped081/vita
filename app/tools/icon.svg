  <path d="M0 760 C90 740 150 650 240 660 C320 668 360 600 430 610 C520 622 560 700 650 690 C740 680 800 610 880 620 C950 628 990 680 1024 690 V1024 H0 Z" fill="url(#back)" opacity=".9"/>
