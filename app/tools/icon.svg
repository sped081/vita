<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Icône de Ma Session : le relief de la session sous une étoile gagnée. Plein cadre, sans transparence (iOS arrondit lui-même les coins). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2B5C"/>
      <stop offset=".55" stop-color="#0C1330"/>
      <stop offset="1" stop-color="#070A14"/>
    </linearGradient>
    <radialGradient id="aurora" cx="150" cy="120" r="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4FD1B8" stop-opacity=".32"/>
      <stop offset="1" stop-color="#4FD1B8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="930" cy="200" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8C7BFF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#8C7BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="512" cy="372" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE38A" stop-opacity=".62"/>
      <stop offset=".35" stop-color="#FFD24D" stop-opacity=".2"/>
      <stop offset="1" stop-color="#FFD24D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBEA"/>
      <stop offset=".6" stop-color="#FFE9A6"/>
      <stop offset="1" stop-color="#FFC93A"/>
    </linearGradient>
    <radialGradient id="core" cx="512" cy="372" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity=".75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B6C8A"/>
      <stop offset="1" stop-color="#101A33"/>
