  <path d="M470 636 L512 604 L554 636 L534 628 L512 646 L490 628 Z" fill="#F4FFFB"/>
  <path d="M0 880 C110 860 190 770 290 776 C380 782 432 664 512 604 C592 664 644 782 734 776 C834 770 914 860 1024 880" fill="none" stroke="#D8FFF4" stroke-width="7" stroke-linecap="round" opacity=".85"/>
  <path d="M512 150 Q526 358 716 372 Q526 386 512 594 Q498 386 308 372 Q498 358 512 150 Z" fill="url(#star)"/>
  <circle cx="512" cy="372" r="46" fill="url(#core)"/>
