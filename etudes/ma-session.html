<title>Ma Session</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    color-scheme:light;
    --bg:#F6F5F1; --card:#FFFFFF; --ink:#1C2030; --muted:#5D6272; --line:#E4E1D8; --soft:#EFEDE6;
    --pri:#136F63; --pri-2:#E2F1EE; --mark:#FFE066; --danger:#C0392B; --danger-2:#FBE9E6; --warn:#B7791F;
    --shadow:0 1px 2px rgba(28,32,48,.05),0 8px 24px rgba(28,32,48,.07);
    --disp:"Fraunces",Georgia,serif; --ui:"Figtree",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;--bg:#12141B;--card:#1A1D27;--ink:#ECEBE6;--muted:#A0A4B2;--line:#2A2E3B;--soft:#222633;
    --pri:#4FC2B1;--pri-2:#163431;--mark:#8A7424;--danger:#F08070;--danger-2:#3A1F1C;--warn:#E3B04B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    color-scheme:dark;--bg:#12141B;--card:#1A1D27;--ink:#ECEBE6;--muted:#A0A4B2;--line:#2A2E3B;--soft:#222633;
    --pri:#4FC2B1;--pri-2:#163431;--mark:#8A7424;--danger:#F08070;--danger-2:#3A1F1C;--warn:#E3B04B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--pri);outline-offset:2px}
  h1,h2,h3{font-family:var(--disp);font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.1}
  .mk{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);padding:0 .08em}

  header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  header.top h1{font-size:1.7rem}
  .save{margin-left:auto;font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
  .save i{width:8px;height:8px;border-radius:50%;background:var(--pri)}
  .save.busy i{background:var(--warn)}
  .tg{all:unset;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:8px}
  .tg:hover{background:var(--card)}


  .example{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--pri-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:18px;font-size:.92rem}
  .example b{color:var(--pri)}
  .btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;background:var(--pri);color:#fff;font-weight:700;font-size:.88rem;padding:9px 14px;border-radius:10px}
  :root[data-theme="dark"] .btn{color:#0f1a18}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0f1a18}}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.sm{padding:6px 10px;font-size:.8rem}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
  .card h2{font-size:1.2rem;margin-bottom:12px}
  .card h3{font-size:1rem;margin-bottom:8px}
  .empty{color:var(--muted);font-size:.92rem;padding:6px 0}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:0 0 auto}
  .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .t{flex:1;min-width:0}
  .row .t b{display:block;font-weight:600}
  .row .t span{color:var(--muted);font-size:.84rem}
  .chip{font-family:var(--mono);font-size:.74rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft);white-space:nowrap}
  .chip.hot{background:var(--danger-2);color:var(--danger)}
  .chip.exam{background:var(--ink);color:var(--bg)}
  input[type=checkbox]{width:20px;height:20px;accent-color:var(--pri);flex:0 0 auto}
  .done .t b{text-decoration:line-through;color:var(--muted)}

  .today-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .today-h h2{font-size:clamp(1.6rem,5vw,2.2rem)}
  .today-h span{color:var(--muted)}

  /* barre d'application et navigation du bas */
  .appbar{background:#161A24;color:#F3F1EA;margin:-18px -16px 18px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;display:flex;align-items:center;gap:12px}
  .appbar h1{font-size:1.75rem;color:#F3F1EA;position:relative}
  .appbar h1::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:4px;border-radius:3px;background:#FFE066}
  .appbar .save{color:#B9BDC8}.appbar .tg{color:#B9BDC8}.appbar .tg:hover{background:rgba(255,255,255,.08)}
  nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#161A24;display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 20px rgba(0,0,0,.18)}
  nav.bottom button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;font-size:.72rem;font-weight:600;color:#9EA3B0;position:relative;text-align:center}
  nav.bottom button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  nav.bottom button[aria-selected="true"]{color:#FFE066;box-shadow:inset 0 3px 0 #FFE066;background:rgba(255,255,255,.04)}
  nav.bottom button:focus-visible{outline:3px solid #FFE066;outline-offset:-3px}
  .badge{position:absolute;top:4px;left:calc(50% + 5px);background:#E5484D;color:#fff;border-radius:999px;font-size:.66rem;font-weight:700;padding:1px 6px;font-family:var(--mono)}
  .wrap{padding-bottom:100px}

  /* bannière et cartes d'évènements */
  .hero{position:relative;overflow:hidden;border-radius:18px;padding:22px 20px 20px;margin-bottom:22px;color:#fff;
    background:radial-gradient(120% 90% at 100% 0%,rgba(255,224,102,.35),transparent 55%),linear-gradient(135deg,#136F63,#1C2B45)}
  .hero .k{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
  .hero h2{font-size:clamp(1.5rem,5.5vw,2.1rem);margin:8px 64px 6px 0;color:#fff}
  .hero p{margin:0;opacity:.9}
  .hero .cd{position:absolute;right:16px;top:16px;background:rgba(255,255,255,.16);border-radius:12px;padding:6px 10px;text-align:center;line-height:1}
  .hero .cd b{display:block;font-family:var(--disp);font-size:1.9rem}
  .hero .cd span{font-size:.7rem;opacity:.85}
  .sechd{display:flex;align-items:center;gap:10px;margin:0 0 10px}
  .sechd h2{font-size:1.45rem}
  .sechd button{all:unset;cursor:pointer;margin-left:auto;color:var(--pri);font-weight:700;font-size:.9rem}
  .hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;margin:0 -16px 24px;padding:4px 16px 12px}
  .ecard{flex:0 0 190px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
  .ecard .dt{text-align:center;padding:10px 6px 8px;background:linear-gradient(var(--soft),var(--card))}
  .ecard .dt .wd{font-size:.85rem;color:var(--muted);text-transform:capitalize}
  .ecard .dt .dn{font-family:var(--disp);font-size:2.5rem;line-height:1;font-weight:700}
  .ecard .dt .mo{font-size:.85rem;color:var(--muted)}
  .ecard .tm{color:#fff;font-weight:700;text-align:center;padding:5px 4px;font-family:var(--mono);font-size:.84rem}
  .ecard .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
  .ecard .ty{font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
  .ecard .nm{font-weight:700;line-height:1.25;margin-top:2px}
  .ecard .cd{font-size:.8rem;color:var(--muted)}
  .ecard .rm{font-weight:700;font-size:.84rem}
  .ecard .md{margin-top:auto;padding-top:10px;font-size:.8rem;color:var(--muted)}

  /* relief, oracle, constellation, IA */
  .relief svg{display:block;width:100%;height:auto;border-radius:12px}
  .relief .info{margin-top:12px;font-size:.95rem}
  .insight{margin:0 0 10px;padding:10px 12px;border-radius:10px;background:var(--pri-2);font-size:.92rem}
  .skywrap{border-radius:14px;overflow:hidden;background:#060A16;margin:6px 0 12px}
  #sky{display:block;width:100%;height:300px;cursor:pointer;touch-action:manipulation}
  @media (max-width:520px){#sky{height:250px}}
  .skystats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .aibox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .aibox .hint{margin:0}
  .btn[disabled]{opacity:.55;cursor:default}

  /* horaire */
  .tt-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow)}
  .tt{display:grid;min-width:640px;position:relative}
  .tt .hd{font-weight:700;font-size:.82rem;text-align:center;padding:10px 4px;border-bottom:1px solid var(--line);background:var(--soft)}
  .tt .hd.now{color:var(--pri)}
  .tt .hr{font-family:var(--mono);font-size:.7rem;color:var(--muted);text-align:right;padding-right:6px;border-right:1px solid var(--line)}
  .tt .col{position:relative;border-right:1px solid var(--line)}
  .tt .col:last-child{border-right:0}
  .tt .line{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
  .blk{position:absolute;left:4px;right:4px;border-radius:8px;padding:5px 7px;font-size:.74rem;line-height:1.25;color:#fff;overflow:hidden;cursor:pointer;border:0;text-align:left}
  .blk b{display:block;font-size:.8rem}
  .form{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
  .form label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:600;color:var(--muted)}
  .form input,.form select{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;min-width:0}
  .form input[type=text]{width:170px}
  .form input.num{width:80px;font-family:var(--mono)}
  .msg{font-size:.84rem;color:var(--danger);min-height:1.2em;margin-top:6px}

  /* cours & notes */
  .course{margin-bottom:16px}
  .course-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .course-h h2{font-size:1.25rem;margin:0}
  .avg{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .avg .big{font-family:var(--mono);font-weight:700;font-size:1.3rem}
  .need{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:.9rem}
  .need b{font-family:var(--mono)}
  table.ev{width:100%;border-collapse:collapse;font-size:.88rem}
  table.ev th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:6px 6px;border-bottom:1px solid var(--line)}
  table.ev td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.ev td.n{font-family:var(--mono);white-space:nowrap}
  table.ev input.grade{width:70px;font-family:var(--mono);border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 7px}
  .tbl{overflow-x:auto}
  .x{all:unset;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:6px}
  .x:hover{color:var(--danger);background:var(--danger-2)}

  /* fiches */
  textarea{width:100%;min-height:180px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-family:var(--mono);font-size:.86rem;line-height:1.6;resize:vertical}
  .hint{font-size:.82rem;color:var(--muted);margin:6px 0 10px}
  .hint code{font-family:var(--mono);background:var(--soft);padding:1px 5px;border-radius:5px}
  .study{position:fixed;inset:0;z-index:20;background:rgba(18,20,27,.6);display:flex;align-items:center;justify-content:center;padding:16px}
  .study[hidden]{display:none}
  .flash{width:min(520px,100%);background:var(--card);border-radius:20px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
  .flash .meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-bottom:12px}
  .flash .q{font-family:var(--disp);font-size:clamp(1.3rem,4.5vw,1.7rem);line-height:1.25;min-height:3.2em}
  .flash .a{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);font-size:1.05rem}
  .flash .acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
  .bar{height:8px;border-radius:6px;background:var(--soft);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:6px}
  .sec[hidden]{display:none}
  .tip{font-size:.84rem;color:var(--muted);margin-top:10px}
</style>

<div class="wrap">
  <header class="appbar">
    <h1>Ma Session</h1>
    <div class="save" id="save"><i></i><span>Chargement…</span></div>
    <button class="tg" id="theme" aria-label="Changer de thème">◐</button>
  </header>

  <div class="example" id="exbar" hidden>
    <span><b>Exemple.</b> Voici une session fictive pour montrer ce que fait l'outil.</span>
    <button class="btn sm" id="clearEx">Effacer l'exemple et commencer</button>
  </div>

  <section class="sec" id="s-today"></section>
  <section class="sec" id="s-sched" hidden></section>
  <section class="sec" id="s-courses" hidden></section>
  <section class="sec" id="s-plan" hidden></section>
  <section class="sec" id="s-cards" hidden></section>
</div>

<nav class="bottom" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="today" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Accueil</button>
  <button role="tab" data-tab="sched" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Horaire</button>
  <button role="tab" data-tab="courses" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M8 7h7M8 11h5"/></svg>Cours<span class="badge" id="bgCourses" hidden></span></button>
  <button role="tab" data-tab="plan" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Étude<span class="badge" id="bgPlan" hidden></span></button>
  <button role="tab" data-tab="cards" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="6" y="3" width="14" height="16" rx="2"/><path d="M4 7v12a2 2 0 0 0 2 2h10"/></svg>Fiches</button>
</nav>

<div class="study" id="study" hidden><div class="flash" id="flash"></div></div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function uid(){return Math.random().toString(36).slice(2,10);}
var COLORS=['#136F63','#D9480F','#1D4ED8','#B42318','#7A5AF8','#0E7490','#A16207','#BE185D'];
var DAYS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
var DAYS_LONG=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];

// ---------- dates (toujours en heure locale) ----------
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function diffDays(a,b){return Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/864e5);}
function dayIdx(d){return (d.getDay()+6)%7;} // 0 = lundi
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
var fmtDate=new Intl.DateTimeFormat('fr-CA',{weekday:'short',day:'numeric',month:'short'});
var fmtLong=new Intl.DateTimeFormat('fr-CA',{weekday:'long',day:'numeric',month:'long'});
function when(s){var n=diffDays(today(),parse(s));if(n===0)return "aujourd'hui";if(n===1)return 'demain';if(n<0)return 'passé';return 'dans '+n+' j';}
var nf=new Intl.NumberFormat('fr-CA',{maximumFractionDigits:1,minimumFractionDigits:1});
function pct(x){return nf.format(x)+' %';}
function mins(t){var p=t.split(':');return +p[0]*60+ +p[1];}

// ---------- exemple (dates relatives à aujourd'hui) ----------
function example(){
  var t=today(),d=function(n){return ymd(addDays(t,n));};
  var c=[{id:'res',name:'Réseaux',color:COLORS[0]},{id:'vir',name:'Virtualisation',color:COLORS[1]},{id:'fra',name:'Français',color:COLORS[3]},{id:'mat',name:'Mathématiques',color:COLORS[2]}];
  return {v:1,example:true,target:60,courses:c,
    classes:[
      {id:uid(),course:'res',day:0,start:'08:15',end:'10:15',room:'B-214',code:'420-RE2-MA',group:'01',kind:'Cours',mode:'Présentiel'},
      {id:uid(),course:'vir',day:0,start:'13:00',end:'16:00',room:'C-102',code:'420-VI1-MA',group:'02',kind:'Cours - Laboratoire',mode:'Présentiel'},
      {id:uid(),course:'fra',day:1,start:'10:30',end:'12:30',room:'A-305',code:'601-102-MQ',group:'14',kind:'Cours',mode:'Présentiel'},
      {id:uid(),course:'mat',day:2,start:'08:15',end:'10:15',room:'',code:'201-NYA-05',group:'03',kind:'Cours',mode:'À distance'},
      {id:uid(),course:'res',day:2,start:'13:00',end:'16:00',room:'C-104',code:'420-RE2-MA',group:'01',kind:'Cours - Laboratoire',mode:'Présentiel'},
      {id:uid(),course:'fra',day:3,start:'10:30',end:'12:30',room:'A-305',code:'601-102-MQ',group:'14',kind:'Cours',mode:'Présentiel'},
      {id:uid(),course:'vir',day:4,start:'09:00',end:'11:00',room:'B-214',code:'420-VI1-MA',group:'02',kind:'Cours',mode:'Présentiel'},
      {id:uid(),course:'mat',day:4,start:'13:00',end:'15:00',room:'B-110',code:'201-NYA-05',group:'03',kind:'Cours',mode:'Présentiel'}],
    evals:[
      {id:uid(),course:'res',name:'Labo 1 : adressage IP',date:d(-18),weight:15,grade:82,exam:false},
      {id:uid(),course:'res',name:'Examen de mi-session',date:d(6),weight:30,grade:null,exam:true},
      {id:uid(),course:'res',name:'Projet final',date:d(40),weight:25,grade:null,exam:false},
      {id:uid(),course:'res',name:'Examen final',date:d(55),weight:30,grade:null,exam:true},
      {id:uid(),course:'vir',name:'Labo ESXi',date:d(-10),weight:20,grade:74,exam:false},
      {id:uid(),course:'vir',name:'Labo iSCSI',date:d(3),weight:20,grade:null,exam:false},
      {id:uid(),course:'vir',name:'Examen pratique',date:d(13),weight:30,grade:null,exam:true},
      {id:uid(),course:'vir',name:'Examen final',date:d(52),weight:30,grade:null,exam:true},
      {id:uid(),course:'fra',name:'Dissertation 1',date:d(-12),weight:25,grade:68,exam:false},
      {id:uid(),course:'fra',name:'Analyse littéraire',date:d(9),weight:35,grade:null,exam:true},
      {id:uid(),course:'fra',name:'Dissertation finale',date:d(50),weight:40,grade:null,exam:true},
      {id:uid(),course:'mat',name:'Test 1',date:d(-15),weight:20,grade:55,exam:false},
      {id:uid(),course:'mat',name:'Test 2',date:d(-4),weight:20,grade:61,exam:false},

    var d=parse(e.date),days=diffDays(t,d);if(days<1||days>28||(+e.weight||0)<10)return;
    var n=Math.max(2,Math.min(6,Math.round((+e.weight)/7)));

    var used={};
    for(var k=0;k<n;k++){

      var date=ymd(addDays(d,-off));
      out.push({key:e.id+'@'+date,date:date,ev:e,left:off,
        what:off===1?'Dernière révision : refaites toutes les fiches':(k===n-1?'Relire les notes et faire la liste des notions':'Exercices et fiches de révision')});

function aiGenerate(){
  var cid=openCourse,notes=(S.notes[cid]||'').trim();
  if(notes.length<40){aiMsg='Écrivez d\'abord quelques lignes de notes.';render();return;}
  aiBusy=true;aiMsg='L\'IA lit vos notes… (jusqu\'à une minute)';aiCtl=new AbortController();render();
  var existing=cards(cid).map(function(x){return x.q.toLowerCase();});
  var prompt='Tu aides un étudiant de cégep à réviser. À partir des notes de cours ci-dessous (cours : '+course(cid).name+'), crée entre 5 et 12 fiches de révision en français.\n'+
    'Règles : une question courte et précise ; une réponse d\'une ou deux phrases ; utilise UNIQUEMENT l\'information présente dans les notes, n\'invente rien ; ne recrée pas les fiches déjà écrites au format « Question :: Réponse ».\n'+
    'Réponds uniquement avec un tableau JSON, par exemple : [{"q":"Port TCP par défaut d\'iSCSI ?","a":"3260"}]\n\nNOTES :\n'+notes.slice(0,12000);
  ai.json(prompt,{signal:aiCtl.signal}).then(function(arr){
    if(!Array.isArray(arr))throw {code:'invalid_json'};
    var add=[];arr.forEach(function(x){if(!x||typeof x.q!=='string'||typeof x.a!=='string')return;
      var q=x.q.replace(/::/g,':').replace(/\s+/g,' ').trim().slice(0,200),a=x.a.replace(/::/g,':').replace(/\s+/g,' ').trim().slice(0,400);
      if(!q||!a||existing.indexOf(q.toLowerCase())>=0)return;existing.push(q.toLowerCase());add.push(q+' :: '+a);});
    if(add.length)S.notes[cid]=(S.notes[cid]||'').replace(/\s*$/,'')+'\n\n# Fiches créées par l\'IA\n'+add.join('\n');
    aiBusy=false;aiMsg=add.length?add.length+' fiches ajoutées à la fin de vos notes. Relisez-les : l\'IA peut se tromper.':'Aucune nouvelle fiche trouvée dans ces notes.';commit();
  },function(e){
    aiBusy=false;var code=e&&e.code;
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].indexOf(code)>=0){ai=null;aiMsg='';}
    else if(code==='cancelled')aiMsg='';
    else if(code==='rate_limited')aiMsg='Trop de demandes pour le moment. Réessayez un peu plus tard.';
    else if(code==='invalid_json')aiMsg='La réponse de l\'IA était illisible. Réessayez.';
    else if(code==='prompt_too_large')aiMsg='Vos notes sont trop longues : découpez-les en plusieurs cours.';
    else aiMsg='Une erreur est survenue. Réessayez.';
    render();
  });
}

// ---------- révision des fiches ----------
var deck=[],di=0,shown=false,right=0;
function startStudy(list){var cs=list||cards(openCourse),now=Date.now();deck=cs.slice().sort(function(a,b){return recall(a.key,now)-recall(b.key,now)||Math.random()-.5;});di=0;shown=false;right=0;$('study').hidden=false;rFlash();}
function rFlash(){
  var f=$('flash');
  if(di>=deck.length){f.innerHTML='<div class="meta"><span>'+esc(deck.length&&deck[0].cid?course(deck[0].cid).name:'')+'</span><span>Terminé</span></div><div class="q">Bravo ! '+right+' / '+deck.length+' réussies.</div><div class="acts"><button class="btn" id="fRe">Recommencer</button><button class="btn ghost" id="fClose">Fermer</button></div>';$('fRe').focus();return;}
  var c=deck[di];
  f.innerHTML='<div class="meta"><span>'+esc(course(c.cid||openCourse).name)+' · '+esc(memLabel(c.key))+'</span><span>'+(di+1)+' / '+deck.length+'</span></div><div class="q">'+esc(c.q)+'</div>'+
    (shown?'<div class="a">'+esc(c.a)+'</div><div class="acts"><button class="btn danger" id="fNo">À revoir</button><button class="btn" id="fYes">Je savais</button></div>':'<div class="acts"><button class="btn" id="fShow">Voir la réponse</button><button class="btn ghost" id="fClose">Arrêter</button></div>');
  var b=$('fShow')||$('fYes');if(b)b.focus();
}
function grade(ok){var c=deck[di],cur=mem(c.key)||{s:0.5,reps:0},st=ok?(cur.reps?cur.s*2.5:1):Math.max(0.3,cur.s*0.4);S.cards[c.key]={s:Math.round(st*1000)/1000,last:Date.now(),reps:(cur.reps||0)+1};if(ok)right++;di++;shown=false;commit();rFlash();}

// ---------- événements ----------
document.addEventListener('click',function(e){
  var t=e.target.closest('button,[data-done]');if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo({top:0});return;}
  if(t.id==='clearEx'){S=blank();commit();tab='courses';render();return;}
  if(t.dataset.cls){if(t.dataset.arm){S.classes=S.classes.filter(function(c){return c.id!==t.dataset.cls;});commit();}else{t.dataset.arm='1';t.innerHTML='<b>Supprimer ?</b>Touchez encore';setTimeout(function(){if(t.isConnected)render();},2500);}return;}
  if(t.dataset.dele){S.evals=S.evals.filter(function(x){return x.id!==t.dataset.dele;});commit();return;}
  if(t.dataset.delc){if(t.dataset.arm){var id=t.dataset.delc;S.courses=S.courses.filter(function(c){return c.id!==id;});S.classes=S.classes.filter(function(c){return c.course!==id;});S.evals=S.evals.filter(function(x){return x.course!==id;});delete S.notes[id];commit();}
    else{t.dataset.arm='1';t.textContent='Confirmer la suppression';setTimeout(function(){if(t.isConnected){delete t.dataset.arm;t.textContent='Supprimer';}},3000);}return;}
  if(t.dataset.oc){openCourse=t.dataset.oc;render();return;}
  if(t.id==='startStudy'){startStudy();return;}
  if(t.id==='revive'){var now=Date.now();startStudy(allCards().filter(function(x){return recall(x.key,now)<0.5;}));return;}
  if(t.id==='aiGen'){if(ai&&!aiBusy)aiGenerate();return;}
  if(t.id==='aiStop'){if(aiCtl)aiCtl.abort();return;}
  if(t.id==='fShow'){shown=true;rFlash();return;}
  if(t.id==='fYes'){grade(true);return;}if(t.id==='fNo'){grade(false);return;}
  if(t.id==='fRe'){startStudy(deck);return;}
  if(t.id==='fClose'){$('study').hidden=true;render();return;}
});
document.addEventListener('click',function(e){
  if(e.target.id==='sky'){skyClick(e);return;}
  var wk=e.target.closest&&e.target.closest('[data-week]');if(!wk)return;
  var i=+wk.getAttribute('data-week'),list=reliefWeeks[i]||[],box=$('reliefInfo');if(!box)return;
  box.innerHTML='<b>Semaine du '+esc(fmtDate.format(addDays(reliefFirst,i*7)))+'</b> : '+(list.length?list.map(function(x){return esc(x.name)+' ('+esc(course(x.course).name)+', '+esc(x.weight)+' %)';}).join(' · '):'aucune évaluation, profitez-en pour prendre de l\'avance.');
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.done){if(t.checked)S.done[t.dataset.done]=true;else delete S.done[t.dataset.done];commit();return;}
  if(t.dataset.grade){var v=t.value.trim().replace(',','.'),ev=S.evals.filter(function(x){return x.id===t.dataset.grade;})[0];if(!ev)return;
    if(v===''){ev.grade=null;}else{var n=Number(v);if(!isFinite(n)||n<0||n>100){t.value=ev.grade==null?'':ev.grade;return;}ev.grade=n;}commit();return;}
  if(t.id==='target'){var n2=Number(t.value);if(isFinite(n2)&&n2>=0&&n2<=100){S.target=n2;commit();}return;}
});
var notesTimer=null;
document.addEventListener('input',function(e){
  if(e.target.id!=='notes')return;S.notes[openCourse]=e.target.value;clearTimeout(notesTimer);
  notesTimer=setTimeout(function(){var pos=e.target.selectionStart;lsSet();if(store.mode==='db'){badge('Enregistrement…',true);clearTimeout(timer);timer=setTimeout(flush,700);}
    var ta=$('notes');rCards();var n=$('notes');if(n){n.focus();n.setSelectionRange(pos,pos);}},900);
});
document.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target;
  if(f.id==='fCourse'){var name=$('nCourse').value.trim();if(!name){$('mCourse').textContent='Donnez un nom au cours.';return;}
    if(S.example){S=blank();}
    S.courses.push({id:uid(),name:name,color:COLORS[S.courses.length%COLORS.length]});commit();return;}
  if(f.id==='fCls'){var s=$('cStart').value,en=$('cEnd').value;if(!s||!en||mins(en)<=mins(s)){$('mCls').textContent='L\'heure de fin doit être après l\'heure de début.';return;}
    S.classes.push({id:uid(),course:$('cCourse').value,day:+$('cDay').value,start:s,end:en,room:$('cRoom').value.trim().slice(0,20),code:$('cCode').value.trim().slice(0,20),group:$('cGroup').value.trim().slice(0,10),kind:$('cKind').value,mode:$('cMode').value});commit();return;}
  if(f.dataset.fev){var nm=f.n.value.trim(),d=f.d.value,w=Number(String(f.w.value).replace(',','.'));
    if(!nm||!d||!isFinite(w)||w<0||w>100)return;
    S.evals.push({id:uid(),course:f.dataset.fev,name:nm.slice(0,60),date:d,weight:w,grade:null,exam:f.x.checked});commit();}
});
addEventListener('keydown',function(e){if($('study').hidden)return;if(e.key==='Escape'){$('study').hidden=true;render();}
  else if(e.key===' '&&!shown&&di<deck.length){e.preventDefault();shown=true;rFlash();}});

var root=document.documentElement;try{var th=localStorage.getItem('ms-theme');if(th)root.setAttribute('data-theme',th);}catch(e){}
$('theme').onclick=function(){var cur=root.getAttribute('data-theme');var dark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches;var n=dark?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('ms-theme',n);}catch(e){}};

window.__ms={stats:stats,plan:plan,cards:cards,oracle:oracle,recall:recall,state:function(){return S;}};
boot();
})();
</script>
