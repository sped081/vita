<title>Ma Session</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* Un seul univers visuel, sombre, assumé : « nuit d'étude ». */
  :root{
    color-scheme:dark;
    --bg:#090C13; --panel:#121827; --panel2:#18203A; --ink:#EEF1F7; --muted:#8E97AB; --faint:#646E84;
    --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
    --pri:#4FD1B8; --pri-ink:#04221D; --pri-soft:rgba(79,209,184,.13);
    --gold:#FFD24D; --danger:#FF6B5E; --danger-soft:rgba(255,107,94,.14); --warn:#FFB547; --good:#5BD68A;
    --r:20px; --shadow:inset 0 1px 0 rgba(255,255,255,.04),0 18px 44px rgba(0,0,0,.42);
    --ease:cubic-bezier(.2,.8,.2,1);
    --disp:"Fraunces",Georgia,serif; --ui:"Figtree",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  h1,h2,h3{font-family:var(--disp);font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.1}
  .ambient{position:fixed;inset:0;z-index:0;pointer-events:none;background:
    radial-gradient(55% 40% at 0% 0%,rgba(79,209,184,.11),transparent 70%),
    radial-gradient(50% 40% at 100% 100%,rgba(255,210,77,.07),transparent 70%),
    radial-gradient(40% 30% at 85% 8%,rgba(96,125,255,.07),transparent 70%)}
  .wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:10px 130px}
  .sec[hidden]{display:none}

  /* en-tête */
  .appbar{display:flex;align-items:center;gap:12px;padding-block:calc(8px + env(safe-area-inset-top,0px)) 16px}
  .logo{width:38px;height:38px;border-radius:11px;overflow:hidden;flex:0 0 auto;background:#0C1330;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 8px 24px rgba(255,210,77,.22)}
  .logo svg{display:block;width:100%;height:100%}
  .appbar h1{font-size:1.55rem}
  .save{margin-left:auto;font-size:.76rem;color:var(--muted);display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.04);border:1px solid var(--line);padding:6px 11px;border-radius:999px;white-space:nowrap}
  .save i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good)}
  .save.busy i{background:var(--warn);box-shadow:0 0 10px var(--warn)}
  .save em{font-style:normal}
  @media (max-width:560px){.save em{display:none}}

  .example{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(90deg,rgba(79,209,184,.14),rgba(255,210,77,.07));border:1px solid rgba(79,209,184,.25);border-radius:16px;padding:12px 14px;margin-bottom:16px;font-size:.9rem}
  .example b{color:var(--pri)}

  /* boutons */
  .btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--pri);color:var(--pri-ink);font-weight:700;font-size:.88rem;padding:10px 16px;border-radius:12px;
    transition:transform .15s var(--ease),filter .15s,box-shadow .2s;box-shadow:0 8px 22px rgba(79,209,184,.22);text-align:center}
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:rgba(255,255,255,.05);color:var(--ink);box-shadow:none;border:1px solid var(--line2)}
  .btn.sm{padding:7px 11px;font-size:.8rem;border-radius:10px}
  .btn.danger{background:var(--danger-soft);color:var(--danger);box-shadow:none}
  .btn[disabled]{opacity:.5;cursor:default;transform:none}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  /* cartes */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
  .card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 60%),var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
  .card h2{font-size:1.22rem;margin:0 0 14px;display:flex;align-items:center;gap:10px}
  .card h3{font-size:1.02rem;margin:0 0 8px}
  .ic{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--line);display:inline-grid;place-items:center;font-size:.95rem;flex:0 0 auto}
  .card h2 .btn{margin-left:auto}
  .empty{color:var(--muted);font-size:.92rem;padding:6px 0}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:0 0 auto;box-shadow:0 0 10px currentColor}
  .row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .t{flex:1;min-width:0;display:block}
  .row .t b{display:block;font-weight:600}
  .row .t span{display:block;color:var(--muted);font-size:.84rem}
  .chip{font-family:var(--mono);font-size:.72rem;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);white-space:nowrap}
  .chip.hot{background:var(--danger-soft);color:var(--danger);border-color:transparent}
  .chip.exam{background:var(--gold);color:#241B00;border-color:transparent}
  .bar{height:8px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:6px}
  .tip{font-size:.82rem;color:var(--muted);margin:12px 0 0}
  .hint{font-size:.84rem;color:var(--muted);margin:6px 0 10px}
  .hint code{font-family:var(--mono);background:rgba(255,255,255,.07);padding:1px 6px;border-radius:6px;color:var(--ink)}
  .insight{margin:0 0 14px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,rgba(79,209,184,.16),rgba(255,210,77,.08));border:1px solid rgba(79,209,184,.3);font-size:.92rem}
  .insight b{color:#fff}

  /* cases à cocher rondes */
  input[type=checkbox]{appearance:none;-webkit-appearance:none;margin:0;width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);display:inline-grid;place-items:center;cursor:pointer;transition:background .2s,border-color .2s,transform .2s var(--ease);flex:0 0 auto}
  input[type=checkbox]:checked{background:var(--pri);border-color:var(--pri);transform:scale(1.06)}
  input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid var(--pri-ink);border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg)}
  .done .t b{text-decoration:line-through;color:var(--muted)}
  .play{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--pri-soft);color:var(--pri);font-size:.8rem;border:1px solid rgba(79,209,184,.3);flex:0 0 auto;transition:transform .15s var(--ease)}
  .play:hover{transform:scale(1.08)}

  /* entrée animée des sections */
  @media (prefers-reduced-motion:no-preference){
    .rise>*{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms)}
    @keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
  }

  /* bannière : ciel selon l'heure */
  .hero{position:relative;height:clamp(280px,42vw,320px);border-radius:26px;overflow:hidden;margin-bottom:14px;border:1px solid var(--line2);box-shadow:var(--shadow);background:linear-gradient(#1B2A55,#0B1020)}
  #heroSky{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hero .ov{position:absolute;inset:0;padding:22px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(180deg,rgba(5,8,14,.15),transparent 35%,rgba(5,8,14,.6))}
  .greet{font-family:var(--disp);font-weight:700;font-size:clamp(2rem,6.5vw,2.8rem);line-height:1;text-shadow:0 2px 24px rgba(0,0,0,.35)}
  .hdate{opacity:.88;margin-top:6px;font-weight:500}
  .next{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
  .next .k{font-size:.68rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
  .next h2{font-size:clamp(1.25rem,4.5vw,1.75rem);margin:4px 0 2px;text-shadow:0 2px 16px rgba(0,0,0,.4)}
  .next p{margin:0;opacity:.88;font-size:.9rem}
  .count{text-align:center;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:10px 14px;min-width:86px;flex:0 0 auto}
  .count b{display:block;font-family:var(--disp);font-size:2.5rem;line-height:1}
  .count span{font-size:.72rem;opacity:.85}

  /* tuiles */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
  @media (max-width:860px){.tiles{grid-template-columns:1fr 1fr}}
  @media (max-width:380px){.tiles .ringbox svg{width:46px;height:46px}.tile,.tbtn{gap:10px;padding:12px}}
  .tile{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0)),var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left}
  .tbtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0)),var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .2s var(--ease)}
  .tbtn:hover{transform:translateY(-2px)}
  .tile .v,.tbtn .v{display:block;font-family:var(--disp);font-weight:700;font-size:1.85rem;line-height:1;white-space:nowrap}
  @media (max-width:430px){.tile .v,.tbtn .v{font-size:1.6rem}}
  .tile .v small,.tbtn .v small{font-family:var(--ui);font-size:.9rem;color:var(--muted);font-weight:600}
  .tile .l,.tbtn .l{display:block;font-size:.78rem;color:var(--muted);margin-top:4px}
  .ringbox{position:relative;flex:0 0 auto;display:grid;place-items:center}
  .star{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;color:var(--gold);background:radial-gradient(circle,rgba(255,210,77,.25),transparent 70%);flex:0 0 auto}
  .star.dim{color:#8A8FA3;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%)}
  @media (prefers-reduced-motion:no-preference){.star{animation:twinkle 3s ease-in-out infinite}@keyframes twinkle{50%{transform:scale(.88);opacity:.75}}}

  /* évènements */
  .sechd{display:flex;align-items:center;gap:10px;margin:0 0 10px}
  .sechd h2{font-size:1.4rem}
  .sechd button{all:unset;cursor:pointer;margin-left:auto;color:var(--pri);font-weight:700;font-size:.88rem}
  .hscroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;margin:0 -16px 26px;padding:6px 16px 16px;scrollbar-width:none}
  .hscroll::-webkit-scrollbar{display:none}
  .ecard{--c:#4FD1B8;flex:0 0 196px;scroll-snap-align:start;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line2);box-shadow:var(--shadow);transition:transform .25s var(--ease);will-change:transform;
    background:var(--panel)}
  .ecard .dt{text-align:center;padding:12px 6px 10px;background:var(--panel2);background:radial-gradient(120% 120% at 50% -20%,color-mix(in srgb,var(--c) 55%,transparent),transparent 72%),var(--panel2)}
  .ecard .wd{font-size:.82rem;color:var(--muted);text-transform:capitalize}
  .ecard .dn{font-family:var(--disp);font-weight:700;font-size:2.9rem;line-height:1}
  .ecard .mo{font-size:.82rem;color:var(--muted)}
  .ecard .tm{color:#fff;font-weight:700;text-align:center;padding:6px 4px;font-family:var(--mono);font-size:.82rem;text-shadow:0 1px 6px rgba(0,0,0,.3)}
  .ecard .bd{padding:11px 13px 13px;display:flex;flex-direction:column;gap:2px;flex:1}
  .ecard .ty{font-size:.64rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  .ecard .nm{font-weight:700;line-height:1.25;margin-top:2px}
  .ecard .cd{font-size:.8rem;color:var(--muted)}
  .ecard .rm{font-weight:700;font-size:.84rem}
  .ecard .md{margin-top:auto;padding-top:10px;font-size:.8rem;color:var(--muted)}

  /* relief */
  .relief svg{display:block;width:100%;height:auto;border-radius:14px}
  .relief .info{margin-top:12px;font-size:.95rem}
  .relief .ridge{stroke-dasharray:1;stroke-dashoffset:0}
  .relief.anim .ridge{animation:draw 1.9s var(--ease) both}
  .relief.anim .fill{animation:fadein 1.2s .25s both}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:no-preference){.relief .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
    @keyframes pulse{from{transform:scale(1);opacity:.85}to{transform:scale(3.4);opacity:0}}}

  /* oracle */
  .gauges{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
  .gcell{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:16px;padding:12px 10px 10px;text-align:center}
  .gauge{width:100%;max-width:130px;height:auto;display:block;margin:0 auto}
  .gv{font-family:var(--disp);font-weight:700;font-size:1.45rem;margin-top:-22px;line-height:1.1}
  .gn{font-size:.8rem;color:var(--muted);display:flex;justify-content:center;align-items:center;gap:6px;margin-top:4px}

  /* constellation */
  .skywrap{border-radius:16px;overflow:hidden;background:#060A16;margin:6px 0 12px;border:1px solid var(--line)}
  #sky{display:block;width:100%;height:320px;cursor:pointer;touch-action:manipulation}
  @media (max-width:520px){#sky{height:260px}}
  .skystats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .aibox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .aibox .hint{margin:0}

  /* horaire */
  .tt-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow)}
  .tt{display:grid;min-width:640px;position:relative}
  .tt .hd{font-weight:700;font-size:.8rem;text-align:center;padding:12px 4px;border-bottom:1px solid var(--line);color:var(--muted);letter-spacing:.04em}
  .tt .hd.now{color:var(--pri)}
  .tt .hr{font-family:var(--mono);font-size:.68rem;color:var(--faint);text-align:right;padding-right:6px;border-right:1px solid var(--line)}
  .tt .col{position:relative;border-right:1px solid var(--line)}
  .tt .col.today{background:linear-gradient(180deg,rgba(79,209,184,.06),transparent)}
  .tt .col:last-child{border-right:0}
  .tt .line{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
  .blk{position:absolute;left:4px;right:4px;border-radius:10px;padding:6px 8px;font-size:.73rem;line-height:1.25;color:#fff;overflow:hidden;cursor:pointer;border:1px solid rgba(255,255,255,.18);text-align:left;box-shadow:0 8px 18px rgba(0,0,0,.35);transition:transform .15s var(--ease)}
  .blk:hover{transform:scale(1.02)}
  .blk b{display:block;font-size:.8rem}
  .nowline{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:3;box-shadow:0 0 10px var(--danger)}
  .nowline::before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--danger)}

  /* formulaires */
  .form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  .form label{display:flex;flex-direction:column;gap:5px;font-size:.76rem;font-weight:600;color:var(--muted)}
  .form input,.form select{border:1px solid var(--line2);background:rgba(255,255,255,.04);border-radius:10px;padding:9px 11px;min-width:0;color:var(--ink)}
  .form input:focus,.form select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
  .form input[type=text]{width:170px}
  .form input.num{width:84px;font-family:var(--mono)}
  .msg{font-size:.84rem;color:var(--danger);min-height:1.2em;margin-top:6px}

  /* cours */
  .course{margin-bottom:16px;overflow:hidden}
  .course::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c,#4FD1B8);box-shadow:0 0 18px var(--c,#4FD1B8)}
  .course-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .course-h h2{font-size:1.3rem;margin:0}
  .avg{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .avg .big{font-family:var(--disp);font-weight:700;font-size:1.5rem}
  .need{margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:.9rem}
  .need b{font-family:var(--mono)}
  .evl{margin-top:4px}
  .evh{display:flex;justify-content:space-between;font-size:.66rem;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);font-weight:700;padding:6px 44px 8px 2px;border-bottom:1px solid var(--line)}
  .evr{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
  .evn{flex:1;min-width:0;line-height:1.35}
  .evn b{font-weight:650}
  .evn .chip.exam{margin-left:6px;font-size:.6rem;padding:2px 7px;vertical-align:1px}
  .evm{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-top:4px}
  .evm .wb{flex:0 0 46px;height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
  .evm .wb i{display:block;height:100%;background:var(--c,var(--pri));border-radius:4px}
  .evr input.grade{width:78px;flex:0 0 78px;text-align:right;font-family:var(--mono);font-size:.95rem;border:1px solid var(--line2);background:rgba(255,255,255,.04);border-radius:10px;padding:8px 10px;color:var(--ink)}
  .evr input.grade.ok{border-color:rgba(91,214,138,.55);background:rgba(91,214,138,.08)}
  .evr input.grade.low{border-color:rgba(255,107,94,.55);background:rgba(255,107,94,.08)}
  .tbl{overflow-x:auto}
  .x{all:unset;cursor:pointer;color:var(--muted);padding:3px 8px;border-radius:8px;font-size:.84rem}
  .x:hover{color:var(--danger);background:var(--danger-soft)}

  /* plan : ligne du temps */
  .timeline{position:relative;padding-left:26px}
  .timeline::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;border-radius:2px;background:linear-gradient(var(--pri),rgba(79,209,184,0))}
  .day{position:relative;margin-bottom:14px}
  .day::before{content:"";position:absolute;left:-24px;top:24px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--pri);box-shadow:0 0 10px var(--pri)}
  .day.is-today::before{background:var(--pri)}
  .pill{display:inline-block;background:var(--gold);color:#241B00;font-family:var(--ui);font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:999px;vertical-align:middle;margin-left:6px}

  /* notes */
  textarea{width:100%;min-height:200px;border:1px solid var(--line2);background:rgba(0,0,0,.25);border-radius:14px;padding:14px;font-family:var(--mono);font-size:.85rem;line-height:1.7;resize:vertical;color:var(--ink)}
  textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}

  /* révision : cartes 3D qu'on retourne et qu'on glisse */
  .study{position:fixed;inset:0;z-index:30;background:rgba(5,7,12,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:16px}
  .study[hidden]{display:none}
  .flash{width:min(520px,100%)}
  .flash .meta{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;color:var(--muted);margin-bottom:10px}
  .prog{height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:16px}
  .prog i{display:block;height:100%;border-radius:4px;transition:width .4s var(--ease)}
  .stage{perspective:1300px;margin-bottom:16px}
  .swipe{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
  .swipe:active{cursor:grabbing}
  @media (prefers-reduced-motion:no-preference){.swipe.enter{animation:cardIn .45s var(--ease) both}@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}}
  .card3d{position:relative;height:clamp(230px,52vw,290px);transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
  .card3d.flipped{transform:rotateY(180deg)}

// Plan d'étude : des séances de 45 min réparties avant chaque évaluation à venir,

    var d=parse(e.date),days=diffDays(t,d);if(days<1||days>28||(+e.weight||0)<10)return;
    var n=Math.max(2,Math.min(6,Math.round((+e.weight)/7)));
    var window=Math.min(days,14);n=Math.min(n,window);
    var used={};
    for(var k=0;k<n;k++){
      var off=Math.floor(k*window/n)+1;             // 1 = la veille
      while(used[off]&&off<window)off++;used[off]=1;
      var date=ymd(addDays(d,-off));
      out.push({key:e.id+'@'+date,date:date,ev:e,left:off,

// ---------- cote R : estimation avec la formule du BCI ----------

    'Réponds uniquement avec un tableau JSON, par exemple : [{"q":"Port TCP par défaut d\'iSCSI ?","a":"3260"}]\n\nNOTES :\n'+notes.slice(0,12000);

      lim={gm:[0,100],gsd:[0.1,60],units:[0.1,10],targetR:[5,50],prevR:[5,50],prevU:[0.1,400]}[k],v2=t.value.trim().replace(',','.');
    if(!obj||!lim)return;if(t.dataset.crg)crOpen=true;
    if(v2===''){obj[k]=null;commit();return;}
    var n3=Number(v2);if(!isFinite(n3)||n3<lim[0]||n3>lim[1]){t.value=num(obj[k])==null?'':obj[k];return;}
    obj[k]=n3;commit();return;}
  if(t.dataset.grade){var v=t.value.trim().replace(',','.'),ev=S.evals.filter(function(x){return x.id===t.dataset.grade;})[0];if(!ev)return;
    if(v===''){ev.grade=null;}else{var n=Number(v);if(!isFinite(n)||n<0||n>100){t.value=ev.grade==null?'':ev.grade;return;}ev.grade=n;}commit();return;}
  if(t.id==='target'){var n2=Number(t.value);if(isFinite(n2)&&n2>=0&&n2<=100){S.target=n2;commit();}return;}
});
document.addEventListener('toggle',function(e){var d=e.target;if(d.classList&&d.classList.contains('more'))crOpen=d.open;},true);
var notesTimer=null;
document.addEventListener('input',function(e){
  if(e.target.id!=='notes')return;S.notes[openCourse]=e.target.value;clearTimeout(notesTimer);
  notesTimer=setTimeout(function(){var pos=e.target.selectionStart;lsSet();if(store.mode==='db'){badge('Enregistrement…',true);clearTimeout(timer);timer=setTimeout(flush,700);}
    rCards();var n=$('notes');if(n){n.focus();n.setSelectionRange(pos,pos);}},900);
});
document.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target;
  if(f.id==='fCourse'){var name=$('nCourse').value.trim();if(!name){$('mCourse').textContent='Donnez un nom au cours.';return;}
    if(S.example){S=blank();}
    S.courses.push({id:uid(),name:name,color:COLORS[S.courses.length%COLORS.length]});commit();return;}
  if(f.id==='fCls'){var s=$('cStart').value,en=$('cEnd').value;if(!s||!en||mins(en)<=mins(s)){$('mCls').textContent='L\'heure de fin doit être après l\'heure de début.';return;}
    S.classes.push({id:uid(),course:$('cCourse').value,day:+$('cDay').value,start:s,end:en,room:$('cRoom').value.trim().slice(0,20),code:$('cCode').value.trim().slice(0,20),group:$('cGroup').value.trim().slice(0,10),kind:$('cKind').value,mode:$('cMode').value});commit();return;}
  if(f.dataset.fev){var nm=f.n.value.trim(),d=f.d.value,w=Number(String(f.w.value).replace(',','.'));
    if(!nm||!d||!isFinite(w)||w<0||w>100)return;
    S.evals.push({id:uid(),course:f.dataset.fev,name:nm.slice(0,60),date:d,weight:w,grade:null,exam:f.x.checked});commit();}
});
addEventListener('keydown',function(e){
  if(!$('sheet').hidden){if(e.key==='Escape')closeSettings();return;}
  if(!$('focus').hidden){if(e.key==='Escape')closeFocus();return;}
  if($('study').hidden)return;
  if(e.key==='Escape'){$('study').hidden=true;render();}
  else if(e.key===' '&&!shown&&di<deck.length&&e.target.tagName!=='BUTTON'){e.preventDefault();flip();}
  else if(shown&&e.key==='ArrowRight'){grade(true);}else if(shown&&e.key==='ArrowLeft'){grade(false);}
});

window.__ms={stats:stats,plan:plan,cards:cards,oracle:oracle,recall:recall,coteR:coteR,crc:crc,earned:earned,streak:streak,state:function(){return S;},focus:fz,setFocusDur:function(s){fz.dur=s;fzReset();}};
boot();
})();
