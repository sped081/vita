<title>Bio Quoi d'neuf MTL</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Archivo:wght@500;700&display=swap">
<style>
  :root{color-scheme:light;--bg:#F4F1EA;--card:#fff;--ink:#12233b;--muted:#5E616B;--line:#E5E0D6;--red:#E63917;--ok:#1a8f4c}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0F1116;--card:#181B22;--ink:#F1EEE7;--muted:#9AA0AB;--line:#282C36;--red:#FF5A38;--ok:#4cc27d}}
  :root[data-theme="dark"]{color-scheme:dark;--bg:#0F1116;--card:#181B22;--ink:#F1EEE7;--muted:#9AA0AB;--line:#282C36;--red:#FF5A38;--ok:#4cc27d}
  *{box-sizing:border-box}html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,sans-serif}
  .wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:28px 40px;display:flex;flex-direction:column;gap:16px}
  h1{font-family:"Oswald",sans-serif;font-weight:700;font-size:2rem;margin:0;line-height:1}
  h1 em{font-style:normal;color:var(--red)}
  .sub{color:var(--muted);margin:0;font-size:.95rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
  .lab{font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:.68rem;color:var(--red)}
  .val{white-space:pre-line;font-size:1.05rem;line-height:1.5;user-select:all;-webkit-user-select:all}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .count{font-size:.75rem;color:var(--muted)}
  button{all:unset;cursor:pointer;background:var(--red);color:#fff;font-weight:700;font-size:1rem;
    padding:14px 18px;border-radius:12px;text-align:center}
  button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  button.done{background:var(--ok)}
  .small button{padding:10px 14px;font-size:.9rem}
</style>

<div class="wrap">
  <h1>Quoi d'neuf <em>MTL</em></h1>
  <p class="sub">Touchez « Copier », puis collez dans Instagram → Modifier le profil.</p>

  <div class="card">
    <div class="lab">Bio</div>
    <div class="val" id="bio">Quoi d'neuf, Montréal? 🗯️
Actu • tendances • sorties • bouffe
Tout ce qui se passe sur l'île en 60 sec 📍
👇 Une vidéo par jour</div>
    <div class="count" id="count"></div>
    <button data-copy="bio">Copier la bio</button>
  </div>

  <div class="card small">
    <div class="lab">Nom</div>
    <div class="row"><div class="val" id="nom">Quoi d'neuf MTL</div><button data-copy="nom">Copier</button></div>
  </div>

  <div class="card small">
    <div class="lab">Nom d'utilisateur</div>
    <div class="row"><div class="val" id="user">quoidneufmtl</div><button data-copy="user">Copier</button></div>
  </div>
</div>

<script>
  var bio=document.getElementById('bio').textContent;
  document.getElementById('count').textContent=[...bio].length+' / 150 caractères';
  document.querySelectorAll('button[data-copy]').forEach(function(b){
    var label=b.textContent;
    b.addEventListener('click',function(){
      var el=document.getElementById(b.dataset.copy);var txt=el.textContent;
      function ok(){b.textContent='Copié ✓';b.classList.add('done');setTimeout(function(){b.textContent=label;b.classList.remove('done');},2000);}
      function fallback(){var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);
        try{if(document.execCommand('copy')){ok();return;}}catch(e){}
        b.textContent='Texte sélectionné : appuyez sur Copier';}
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,fallback);}else fallback();
    });
  });
</script>
